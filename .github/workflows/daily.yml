name: 每日美债恒科晨报

on:
  schedule:
    # UTC 00:17 = 北京时间 08:17（避开 :00/:30 高争抢分钟）
    # GitHub 的 schedule 是 best-effort，延迟数小时甚至当天不跑都出现过
    - cron: "17 0 * * *"
  workflow_dispatch: {}   # 手动 / 外部定时器经 API 派发

# 原生 cron 与外部定时器可能撞车，串行化，避免重复发信
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 触发来源
        run: echo "triggered by ${{ github.event_name }} / ${{ github.event.schedule }}"

      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 生成并发送晨报
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_AUTH_CODE: ${{ secrets.MAIL_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/daily_report.py
